<div class="register-container">
  <mat-card class="register-card">
    <mat-card-header>
      <mat-card-title>Register Your Hotel</mat-card-title>
      <mat-card-subtitle>Join our premium network of hosts</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <formly-form [form]="form" [model]="model" [fields]="fields"></formly-form>

        <div class="actions">
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="!form.valid"
            class="submit-button"
          >
            Register Hotel
          </button>
        </div>
      </form>

      <div
        *ngIf="showSuccessMessage"
        class="mat-elevation-z2 mat-alert-success mt-3 p-3"
      >
        <div class="alert-content">
          <i class="material-icons">check_circle</i>
          <span>Hotel registered successfully!</span>
        </div>
      </div>

      <div
        *ngIf="showErrorMessage"
        class="mat-elevation-z2 mat-alert-danger mt-3 p-3"
      >
        <div class="alert-content">
          <i class="material-icons">error</i>
          <span>Please fill all required fields correctly.</span>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
